<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glosario · Física Universitaria Interactiva</title>
    <meta name="description" content="Términos clave con definiciones breves, en orden alfabético." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121113" media="(prefers-color-scheme: dark)" />
    <script>
      try {
        const t = localStorage.getItem('fui:tema');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <link rel="stylesheet" href="vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/libro.css" />
    <script type="module" src="js/sitio.js"></script>
  </head>
  <body>
    <main class="pagina">
      <p class="sobre">Referencia</p>
      <h1>Glosario</h1>
      <p class="lead">
        Las palabras subrayadas con puntos en el texto aparecen aquí. Cada definición indica la sección donde se presenta.
      </p>
      <div data-generar="glosario"></div>
    </main>
  </body>
</html>
